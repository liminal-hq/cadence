name: Workspace Quality and Validation CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: write
  contents: read
  packages: read
  pull-requests: write

jobs:
  rust-fmt:
    name: Rust format
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/liminal-hq/tauri-ci-desktop:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Rust formatting
        id: rust_fmt
        run: cargo fmt --all -- --check

      - name: Publish results
        if: always()
        run: |
          echo "## Rust formatting" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Result: \`${{ steps.rust_fmt.outcome }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Command: \`cargo fmt --all -- --check\`" >> "${GITHUB_STEP_SUMMARY}"

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/liminal-hq/tauri-ci-desktop:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        id: rust_clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Publish results
        if: always()
        run: |
          echo "## Rust clippy" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Result: \`${{ steps.rust_clippy.outcome }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Command: \`cargo clippy --workspace --all-targets --locked -- -D warnings\`" >> "${GITHUB_STEP_SUMMARY}"

  rust-test:
    name: Rust test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/liminal-hq/tauri-ci-desktop:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        id: rust_tests
        run: cargo nextest run --workspace --config-file nextest.toml --profile ci

      - name: Upload Rust test artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: error

      - name: Publish Rust unit test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Cadence Rust tests
          files: target/nextest/ci/junit.xml

      - name: Publish results
        if: always()
        run: |
          echo "## Rust tests" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Result: \`${{ steps.rust_tests.outcome }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Command: \`cargo nextest run --workspace --config-file nextest.toml --profile ci\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Test artefact: \`target/nextest/ci/junit.xml\`" >> "${GITHUB_STEP_SUMMARY}"

  ts-bindings-drift:
    name: TS bindings drift
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/liminal-hq/tauri-ci-desktop:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Snapshot committed bindings
        run: cp -r apps/cadence/src/domain/generated /tmp/generated-before

      - name: Regenerate ts-rs bindings
        run: cargo test -p cadence --lib

      - name: Check for uncommitted bindings drift
        id: ts_bindings_drift
        run: diff -rq /tmp/generated-before apps/cadence/src/domain/generated

      - name: Publish results
        if: always()
        run: |
          echo "## TS bindings drift" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Result: \`${{ steps.ts_bindings_drift.outcome }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Command: \`cargo test -p cadence --lib\` then diff against the committed apps/cadence/src/domain/generated" >> "${GITHUB_STEP_SUMMARY}"

  js-build:
    name: JS build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the workspace app
        id: js_build
        run: bun run build

      - name: Publish results
        if: always()
        run: |
          echo "## JavaScript build" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Result: \`${{ steps.js_build.outcome }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Command: \`bun run build\`" >> "${GITHUB_STEP_SUMMARY}"

  js-format:
    name: JS format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check workspace formatting
        id: js_format
        run: bun run format:check

      - name: Publish results
        if: always()
        run: |
          echo "## JavaScript formatting" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Result: \`${{ steps.js_format.outcome }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Command: \`bun run format:check\`" >> "${GITHUB_STEP_SUMMARY}"

  js-test:
    name: JS test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run JS tests
        id: js_tests
        run: bun run test:js:ci

      - name: Upload JS test artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-test-results
          path: test-results/cadence/junit.xml
          if-no-files-found: error

      - name: Publish unit test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Cadence JS tests
          files: test-results/cadence/junit.xml

      - name: Publish results
        if: always()
        run: |
          echo "## JavaScript tests" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Result: \`${{ steps.js_tests.outcome }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Command: \`bun run test:js:ci\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Test artefact: \`test-results/cadence/junit.xml\`" >> "${GITHUB_STEP_SUMMARY}"

  check-license-headers:
    name: Licence headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check licence headers
        run: bash scripts/check-headers.sh
