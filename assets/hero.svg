<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Cadence</title>
  <desc id="hero-desc">Local-first Android training journal with a Wear OS companion. A dark-themed banner with a pulse/rep-tempo visualisation.</desc>

  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>

    <!-- Brand gradient: orange to pink to purple (shared Liminal HQ identity) -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffaa40"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Pulse beam: cyan -->
    <linearGradient id="pulse-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5aa2ff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#5aa2ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5aa2ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Sync beam: green -->
    <linearGradient id="sync-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ec66a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2ec66a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2ec66a" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle text glow -->
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- Ambient glow circles -->
  <g opacity="0.08">
    <circle cx="180" cy="260" r="170" fill="#a78bfa"/>
    <circle cx="1020" cy="70" r="160" fill="#ffaa40"/>
    <circle cx="620" cy="150" r="210" fill="#5aa2ff"/>
  </g>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#5aa2ff" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- Cadence pulse line: rhythmic rep-tempo trace -->
  <path id="pulse-main" d="M80 172 L210 172 L235 132 L262 214 L290 172 L500 172 L525 138 L552 208 L580 172 L850 172 L875 144 L902 202 L930 172 L1120 172" stroke="url(#pulse-beam)" stroke-width="2.5" fill="none" opacity="0.55"/>

  <!-- Phone-to-watch sync arc -->
  <path id="sync-arc" d="M260 214 C400 250, 760 250, 900 202" stroke="url(#sync-beam)" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="3 6"/>

  <!-- Animated pulse particle: the current beat travelling the tempo line -->
  <g>
    <circle r="4" fill="#5aa2ff" opacity="0.85">
      <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#pulse-main"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Animated sync particle: a queued change reconciling phone/watch -->
  <g>
    <circle r="3" fill="#2ec66a" opacity="0.75">
      <animateMotion dur="3.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#sync-arc"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Rep-beat node markers -->
  <g filter="url(#glow)">
    <circle cx="262" cy="214" r="6" fill="#ffaa40" opacity="0.9"/>
    <text x="238" y="238" fill="#ffaa40" font-size="11" font-family="monospace" opacity="0.6">log set</text>

    <circle cx="552" cy="208" r="5" fill="#5aa2ff" opacity="0.8"/>
    <text x="530" y="232" fill="#5aa2ff" font-size="11" font-family="monospace" opacity="0.6">rest</text>

    <circle cx="902" cy="202" r="5" fill="#2ec66a" opacity="0.85"/>
    <text x="880" y="226" fill="#2ec66a" font-size="11" font-family="monospace" opacity="0.6">sync</text>
  </g>

  <!-- Title -->
  <text x="80" y="68" font-size="42" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" letter-spacing="-0.02em" fill="url(#brand)" filter="url(#text-glow)">Cadence</text>

  <!-- Tagline -->
  <text x="82" y="96" fill="#b4bfce" font-size="16" font-family="'Inter', system-ui, sans-serif">A local-first training journal with a Wear OS companion</text>

  <!-- Set x reps badge: planned (hollow) vs completed (filled) encoded directly in the mark -->
  <g transform="translate(966, 42)">
    <rect width="154" height="38" rx="10" fill="#0f1520" stroke="#2e3540" stroke-width="1"/>
    <circle cx="22" cy="19" r="5" fill="none" stroke="#7c8796" stroke-width="1.5"/>
    <circle cx="38" cy="19" r="5" fill="#2ec66a"/>
    <text x="54" y="25" font-size="17" font-family="monospace" font-weight="700">
      <tspan fill="#e6e9ee">3</tspan><tspan fill="#7c8796">&#x00d7;</tspan><tspan fill="#e6e9ee">8</tspan>
    </text>
  </g>

  <!-- Bottom info line -->
  <text x="80" y="290" fill="#7c8796" font-size="13" font-family="monospace">
    <tspan fill="#9aa4b2">workouts</tspan>
    <tspan fill="#2e3540"> | </tspan>
    <tspan fill="#9aa4b2">routines</tspan>
    <tspan fill="#2e3540"> | </tspan>
    <tspan fill="#9aa4b2">progress</tspan>
    <tspan fill="#2e3540"> | </tspan>
    <tspan fill="#9aa4b2">wear os</tspan>
    <tspan fill="#2e3540">  &#x2022;  </tspan>
    <tspan fill="#7c8796">Liminal HQ</tspan>
  </text>
</svg>
