[package]
name = "cadence"
version = "0.1.0"
description = "Cadence training journal"
authors = ["Liminal HQ, Scott Morris"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cadence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
tauri-plugin-window-state = "2"
tauri-plugin-prevent-default = "5"

# Dev/debug tooling. Always compiled in (a normal dependency), but only
# *registered* under #[cfg(debug_assertions)] in src/lib.rs, so it is
# present but inert in release builds -- same pattern as Spindle/Threshold.
tauri-plugin-mcp-bridge = "0.13"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "json", "migrate"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["time", "sync", "rt", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
log = "0.4.34"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
ts-rs = "12.0.1"
