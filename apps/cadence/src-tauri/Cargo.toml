[package]
name = "cadence"
version = "0.1.0"
description = "Cadence training journal"
authors = ["Liminal HQ, Scott Morris"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cadence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
tauri-plugin-window-state = "2"

# Dev/debug tooling. Always compiled in (a normal dependency), but only
# *registered* under #[cfg(debug_assertions)] in src/lib.rs, so it is
# present but inert in release builds -- same pattern as Spindle/Threshold.
tauri-plugin-mcp-bridge = "0.13"
