		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&display=swap"
			rel="stylesheet"
		/>
		<!-- Icon glyphs render as their literal ligature name (e.g. "arrow_back") until this
		     font paints, so it gets display=block instead of the body font's display=swap --
		     a brief blank icon beats a flash of readable-but-wrong fallback text. -->
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&display=block"
			rel="stylesheet"
		/>
